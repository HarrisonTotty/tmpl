[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "tmpl"
authors = [{ name = "Harrison Totty", email = "harrison+tmpl@totty.dev" }]
description = "A highly-configurable general purpose templating program."
readme = "README.md"
requires-python = ">=3.13"
version = "3.0.0"
dependencies = [
    "click>=8.2.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
]

[project.scripts]
tmpl = "tmpl:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "poethepoet>=0.36.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-randomly>=3.16.0",
    "ruff>=0.12.4",
]

[tool.mypy]
files = "src/**/*.py"
pretty = true
disallow_untyped_defs = true
check_untyped_defs = true
strict = true

[tool.poe]
executor.type = "uv"

[tool.poe.tasks]
format = "ruff format"
lint.shell = "ruff check --fix && mypy"
test = "pytest"
tmpl = "tmpl"

[tool.pytest.ini_options]
addopts = "-v --cov=tmpl"
python_files = "*.py"
python_functions = "test_*"
pythonpath = "src/tmpl"
testpaths = "tests"

[tool.ruff.format]
docstring-code-format =  true
line-ending = "lf"
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true
