[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "tmpl"
description = "A highly-configurable general purpose templating program."
readme = "README.md"
requires-python = ">=3.13"
version = "3.0.0"
dependencies = [
    "click>=8.2.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "poethepoet>=0.36.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-randomly>=3.16.0",
    "ruff>=0.12.4",
]

[tool.pytest.ini_options]
addopts = "-v --cov=tmpl"
python_files = "*.py"
python_functions = "test_*"
pythonpath = "src/tmpl"
testpaths = "tests"
